<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Квесты</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Rubik', sans-serif;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .game-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quests-container {
            width: 80vw;
            max-width: 900px;
            background: #F4E4C2;
            border-radius: 40px;
            border: 5px solid #854D25;
            padding: 30px 40px 40px;
            text-align: center;
        }

        .quests-title {
            font-size: 42px;
            font-weight: 900;
            color: #854D25;
            margin-bottom: 20px;
        }

        .timer-box {
            background: #d4b88c;
            border-radius: 50px;
            padding: 10px 20px;
            margin-bottom: 30px;
            display: inline-block;
        }

        .timer-box span {
            font-size: 20px;
            font-weight: 700;
            color: #4a2a0e;
        }

        .timer-box .timer {
            font-size: 24px;
            color: #854D25;
            font-weight: 900;
        }

        .quests-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .quest-item {
            background: #d4b88c;
            border-radius: 30px;
            padding: 20px 25px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .quest-item.completed {
            background: #98CB55;
        }

        .quest-status {
            font-size: 18px;
            font-weight: 600;
            color: #854D25;
            text-align: right;
            margin-bottom: 10px;
        }

        .quest-item.completed .quest-status {
            color: #98CB55;
        }

        .quest-description {
            font-size: 16px;
            color: #854D25;
            margin-bottom: 12px;
        }

        .quest-progress {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex: 1;
            height: 12px;
            background: #854D25;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #98CB55;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .quest-item.completed .progress-fill {
            background: #5A753C;
        }

        .progress-text {
            font-size: 18px;
            font-weight: 700;
            color: #854D25;
            min-width: 70px;
        }

        .reward {
            margin-top: 10px;
            font-size: 14px;
            color: #854D25;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .reward-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .reward-item img {
            width: 24px;
            height: 24px;
        }

        .btn-close {
            background: #854D25;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-close:hover {
            transform: scale(1.05);
            background: #6b3d1f;
        }


        /* кнопка закрытия */
        .close-btn {
            position: absolute;
            top: 107px;
            right: 357px;
            width: 65px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        .close-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

    </style>
</head>
<body>
    <div class="game-bg">
        <img src="images/MainScreen/общий фон.svg" alt="Фон">
    </div>

    <div class="close-btn" id="closeBtn">
            <img src="images/MainScreen/Book/крестик.svg" alt="Закрыть" />
        </div>


    <div class="game-content">
        <div class="quests-container">
            <div class="quests-title">ЕЖЕДНЕВНЫЕ КВЕСТЫ</div>
            
            <div class="timer-box">
                <span>Обновление через: </span>
                <span class="timer" id="resetTimer">--:--:--</span>
            </div>

            <div class="quests-list" id="questsList"></div>
        </div>
    </div>

    <script src="js/soundManager.js"></script>

    <script type="module">
    import api from './js/apiClient.js';

    function waitForSoundManager(cb) {
        if (window.soundManager && window.soundManager.sounds.music.game) {
            cb(window.soundManager);
            return;
        }
        const timer = setInterval(() => {
            if (window.soundManager && window.soundManager.sounds.music.game) {
                clearInterval(timer);
                cb(window.soundManager);
            }
        }, 50);
    }
 
    document.addEventListener('DOMContentLoaded', () => {
        waitForSoundManager(sm => {
            sm.loadSettings();
            const lastType = sessionStorage.getItem('musicType') || 'game';
            if (!sm.currentMusic || sm.currentMusic.paused) {
                sm.playMusic(lastType);
            }
        });
    });

    const ICONS = {
        gems: 'images/MainScreen/семечка.svg',
        water: 'images/MainScreen/иконка капли.svg',
        coins: 'images/MainScreen/иконка пыльцы.svg'
    };

    let quests = [];

    async function loadQuests() {
        try {
            quests = await api.getQuests();
            renderQuests();
        } catch (error) {
            console.error('Ошибка загрузки квестов:', error);
        }
    }

    function renderQuests() {
        const container = document.getElementById('questsList');
        if (!container) return;
            
        container.innerHTML = '';
            
        quests.forEach(quest => {
            const percent = (quest.current / quest.required) * 100;
            const isCompleted = quest.completed;
                
            const questDiv = document.createElement('div');
            questDiv.className = `quest-item ${isCompleted ? 'completed' : ''}`;
                
            let rewardsHtml = '<div class="reward">Награда: ';
            if (quest.rewards.coins) {
                rewardsHtml += `<div class="reward-item"><img src="${ICONS.coins}"> ${quest.rewards.coins}</div>`;
            }
            if (quest.rewards.water) {
                rewardsHtml += `<div class="reward-item"><img src="${ICONS.water}"> ${quest.rewards.water}</div>`;
            }
            if (quest.rewards.gems) {
                rewardsHtml += `<div class="reward-item"><img src="${ICONS.gems}"> ${quest.rewards.gems}</div>`;
            }
            rewardsHtml += '</div>';
                
            questDiv.innerHTML = `
                <div class="quest-description">${quest.description}</div>
                <div class="quest-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%;"></div>
                    </div>
                    <div class="progress-text">${quest.current}/${quest.required}</div>
                </div>
                ${rewardsHtml}
            `;
                
            container.appendChild(questDiv);
        });
    }

    function updateResetTimer() {
        const now = new Date();
        const tomorrow = new Date(now);
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(0, 0, 0, 0);
            
        const diff = tomorrow - now;
        const hours = Math.floor(diff / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
            
        const timerElement = document.getElementById('resetTimer');
        if (timerElement) {
            timerElement.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    }

    window.updateQuestProgress = async (type, increment) => {
        try {
            const result = await api.updateQuest(type, increment);
            if (result.quest && result.quest.rewardGiven) {
                const toast = document.createElement('div');
                toast.textContent = `Квест выполнен! Награда получена!`;
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.background = '#6B8E23';
                toast.style.color = 'white';
                toast.style.padding = '12px 24px';
                toast.style.borderRadius = '40px';
                toast.style.fontWeight = 'bold';
                toast.style.zIndex = '2000';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
            await loadQuests();
        } catch (error) {
            console.error('Ошибка обновления квеста:', error);
        }
    };

    if (closeBtn) {
        closeBtn.onclick = () => waitForSoundManager(sm => sm.navigate('game.html', 'small'));
    }
    
    loadQuests();
    updateResetTimer();
    setInterval(updateResetTimer, 1000);
    setInterval(loadQuests, 60000);
    </script>
</body>
</html>
