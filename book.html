<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Книжка персонажей</title>
    <style>

    @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');

    /* Сброс отступов */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Rubik', sans-serif;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
    }

    /* фон */
    .game-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
    }

    .game-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
    }

    /* книжка */
    .book-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -52%);
        width: 90vw;
        max-width: 1200px;
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .book-image {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }

    /* сетка персонажей внутри книжки */
    .characters-grid {
        position: absolute;
        top: 20%;
        bottom: 10%;
        left: 15.7%;
        right: 14%;
        width: auto;
        height: 65%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
        overflow-y: auto;
        padding: 12px;
        z-index: 10;
    }

    /* карточка персонажа */
    .character-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        border: 5px solid #854D25;
        padding: 10px;
    }

    .character-card:hover {
        transform: scale(1.05);
    }

    /* изображение персонажа */
    .character-img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        margin-bottom: 8px;
    }

    .character-name {
        font-size: 12px;
        font-weight: bold;
        color: #854D25;
        text-align: center;
    }

    /* ч/б фильтр для заблокированных */
    .character-card.locked .character-img {
        filter: grayscale(100%);
        opacity: 0.6;
    }

    .character-card.locked .character-name {
        color: #999;
    }

    .character-detail {
        position: absolute;
        top: 20%;
        bottom: 2%;
        left: 15.7%;
        right: 14%;
        width: auto;
        height: 65%;
        background: transparent;
        border: none;
        padding: 30px;
        z-index: 15;
        display: none;
    }

    /* контейнер для левой части (имя + картинка) */
    .detail-left {
        position: absolute;
        left: 4,5%;
        top: 52%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .detail-image {
        width: 350px;
        height: 350px;
        object-fit: contain;
    }

    .name-row {
        display: flex;
        align-items: center;
        gap: 10px;       
    }

    .detail-name {
        font-size: 28px;
        font-weight: bold;
        color: #854D25;
        margin: 0;
    }

    .inform-btn {
        width: 35px;
        transition: transform 0.3s ease;
    }

    .inform-btn:hover {
        transform: scale(1.1);
    }

    .inform-btn img {
        width: 100%;
        height: auto;
        display: block;
    }

    .detail-rarity {

        font-size: 28px;
        font-weight: bold;
        color: #854D25;
        text-align: center;
    }


    .detail-back-btn {
        position: fixed;
            bottom: 30px;
            left: 30px;
            background: #854D25;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            transition: transform 0.2s;
            z-index: 20;
            font-size: 22px;
    }

    .detail-back-btn:hover {
        transform: scale(1.05);    
        background: #6b3d1f;
    }

    .detail-back-btn2 {
        position: absolute;
        bottom: 0;
        left: 75%;
        transform: translateX(-50%);
        padding: 10px 30px;
        background: #854D25;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 22px;
        transition: transform 0.2s ease;
    }

    .detail-back-btn2:hover {
        transform: translateX(-50%) scale(1.05);
        background: #6b3d1f;
    }

    /* кнопка закрытия */
    .close-btn {
        position: absolute;
        top: 80px;
        right: 130px;
        width: 65px;
        transition: transform 0.3s ease;
        z-index: 20;
    }

    .close-btn:hover {
        transform: scale(1.1);
    }

    .close-btn img {
        width: 100%;
        height: auto;
        display: block;
    }



    /* скролл*/
    .characters-grid::-webkit-scrollbar {
        width: 8px;
    }

    .characters-grid::-webkit-scrollbar-track {
        background: rgba(133, 77, 37, 0.2);
        border-radius: 10px;
    }

    .characters-grid::-webkit-scrollbar-thumb {
        background: #854D25;
        border-radius: 10px;
    }

    .toast-notification {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #4a3520 0%, #3a2510 100%);
        color: #f5e6d3;
        padding: 0;
        border-radius: 12px;
        z-index: 10000;
        font-family: 'Jost', sans-serif;
        font-size: 16px;
        max-width: 400px;
        min-width: 300px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border-left: 4px solid #705e3d;
        transform: translateX(120%);
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }   

    .toast-notification.show {
        transform: translateX(0);
    }

    .toast-notification:hover {
        transform: translateX(-5px);
    }

    .toast-content {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        gap: 12px;
    }

    .toast-icon {
        font-size: 24px;
        flex-shrink: 0;
        animation: shake 0.5s ease;
    }

    .toast-message {
        flex: 1;
        line-height: 1.4;
        word-break: break-word;
    }

    .toast-close {
        background: none;
        border: none;
        color: #f5e6d3;
        font-size: 20px;
        padding: 0;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background 0.2s;
        flex-shrink: 0;
    }

    .toast-close:hover {
        background: rgba(139, 90, 43, 0.5);
    }

    /* прогресс-бар */
    .toast-progress {
        height: 4px;
        background: #705e3d;
        border-radius: 0 0 12px 12px;
        overflow: hidden;
    }

    .toast-progress-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #8bc58b, #88ff88);
        animation: progress 3s linear forwards;
        border-radius: 0 0 0 12px;
    }

    /* анимация иконки */
    @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(10deg); }
        75% { transform: rotate(-10deg); }
    }

    /* анимация прогресс-бара */
    @keyframes progress {
        from {
            width: 100%;
        }
        to {
            width: 0%;
        }
    }


    /* левая панель с лором (по умолчанию скрыта) */
    .lore-panel {
        position: absolute;
        top: 52%;
        left: 68%;
        transform: translate(-50%, -50%);
        width: 400px;
        padding: 20px;
        text-align: center;
        z-index: 20;
        display: none;
    }

    .lore-text {
        font-size: 16px;
        line-height: 1.5;
        color: #854D25;
        margin-bottom: 15px;
    }

    .close-lore-btn {
        position: absolute;
        bottom: 3px;
        left: 75%;
        transform: translateX(-50%);
        padding: 10px 30px;
        background: #854D25;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        transition: transform 0.2s ease;
    }

    .close-lore-btn:hover {
        transform: translateX(-50%) scale(1.05);
        background: #6b3d1f;
    }


    /* запрет выделения всех элементов на странице */
    * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
    }




    /* правая панель */
    .detail-right {
        position: absolute;
        right: 4%;
        top: 52%;
        transform: translateY(-50%);
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 25px;        
    }

    /* панель статов */
    .stats-panel {
        background: #D7C1A9;
        border-radius: 30px;
        border: 3px solid #854D25;
        padding: 20px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 22px;
        font-weight: bold;
        color: #854D25;
        padding: 5px 0;
    }

    .stat-label {
        color: #854D25;
    }

    .skill-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;          
        padding: 25px;                       
    }

    .skill-icon-simple {
        width: 170px;
        height: 170px;
        object-fit: contain;
        display: block;
    }

    .skill-question {
        width: 45px;
        transition: transform 0.2s;
    }

    .skill-question:hover {
        transform: scale(1.1);
    }

    .skill-question img {
        width: 100%;
        height: auto;
        display: block;
    }

    .lvlup-btn {
        display: block;
        width: 70%;
        margin: 0 auto;
        transition: transform 0.2s;
        border: none;
        background: none;
        padding: 0;
    }

    .lvlup-btn img {
        width: 100%;
        height: auto;
        display: block;
    }

    .lvlup-btn:hover {
        transform: scale(1.05);
    }

    .skill-description-panel {
        position: absolute;
        top: 52%;
        left: 68%;
        transform: translate(-50%, -50%);
        width: 400px;
        padding: 20px;
        text-align: center;
        z-index: 20;
        display: none;
    }

    .skill-description-text {
        white-space: pre-wrap; 
        font-size: 16px;
        line-height: 1.5;
        color: #854D25;
        margin-bottom: 15px;
    }

    .close-skill-btn {
        position: absolute;
        bottom: 3px;
        left: 75%;
        transform: translateX(-50%);
        padding: 10px 30px;
        background: #854D25;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        transition: transform 0.2s ease;
    }

    .close-skill-btn:hover {
        transform: translateX(-50%) scale(1.05);
        background: #6b3d1f;
    }

    .detail-back-btn3 {
        position: absolute;
        bottom: 0;
        left: 75%;
        transform: translateX(-50%);
        padding: 10px 30px;
        background: #854D25;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 22px;
        transition: transform 0.2s ease;
    }

    .detail-back-btn3:hover {
        transform: translateX(-50%) scale(1.05);
        background: #6b3d1f;
    }



    .buff-toast {
        position: fixed;
        z-index: 50;
        font-family: 'Rubik', sans-serif;
        font-size: 18px; font-weight: 700;
        color: #854D25;
        pointer-events: none;
        animation: buffFloat 2s ease forwards;
    }

    @keyframes buffFloat {
        0%   { opacity: 1; transform: translateY(0); }
        80%  { opacity: 1; }
        100% { opacity: 0; transform: translateY(-60px); }
    }

    </style>
</head>
<body>
    <!-- фон -->
    <div class="game-bg">
        <img src="images/MainScreen/общий фон.svg" alt="Фон игры" />
    </div>

    <button class="detail-back-btn" id="backToGridBtn" style="display: none;">← Назад к списку</button>  

    <!-- книжка -->
    <div class="book-container">
        <img src="images/MainScreen/Book/книга открыта.svg" alt="Книжка" class="book-image" />

        <!-- крестик -->
        <div class="close-btn" id="closeBtn">
            <img src="images/MainScreen/Book/крестик.svg" alt="Закрыть" />
        </div>

        <!-- сетка персонажей -->
        <div class="characters-grid" id="charactersGrid">
        </div>

        <!-- карточка персонажа -->
        <div class="character-detail" id="characterDetail">
            <div class="detail-left">
                <!-- горизонтальный блок для имени и вопроса -->
                <div class="name-row">
                    <div class="detail-name" id="detailName"></div>
                    <div class="inform-btn" id="informBtn">
                        <img src="images/Book/вопрос.svg" alt="Лор" />
                    </div>
                </div>
        
                <div class="detail-rarity" id="detailRarity"></div>
                <img src="" alt="Персонаж" id="detailImage" class="detail-image" />
                
            </div>

            <button class="detail-back-btn2" id="closeLoreBtn" style="display: none;">Закрыть</button>
            <button class="detail-back-btn3" id="closeSkillBtn" style="display: none;">Закрыть</button>

            <!-- правая панель (статы + способность + улучшение) -->
            <div class="detail-right" id="detailDescription">
                <!-- блок со статами -->
                <div class="stats-panel">
                    <div class="stat-row">
                        <span class="stat-label">Здоровье:</span>
                        <span class="stat-value" id="statHp">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Атака:</span>
                        <span class="stat-value" id="statAtk">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Защита:</span>
                        <span class="stat-value" id="statDef">0</span>
                    </div>
                </div>

                <!-- блок со способностью (иконка + вопрос) -->
                <div class="skill-row">
                    <img src="" id="skillIcon" class="skill-icon-simple" alt="Способность">
                    <div class="skill-question" id="skillQuestionBtn">
                        <img src="images/Book/вопрос темный.svg" alt="?" />
                    </div>
                </div>

                <!-- кнопка улучшения -->
                <button class="lvlup-btn" id="lvlupBtn">
                    <img src="images/Book/кнопка улучшения.svg" alt="Повысить уровень">
                </button>
            </div>
        </div>

        <!-- панель лора  -->
        <div class="lore-panel" id="lorePanel">
            <div class="lore-text" id="loreText"></div>   
        </div>
        <!-- панель описания способности -->
        <div class="skill-description-panel" id="skillPanel">
            <div class="skill-description-text" id="skillText"></div>
        </div>
    </div>

    <script src="js/soundManager.js"></script>

    <script type="module">
    import api from './js/apiClient.js';

    function showBuffToast(text, color) {
        const toast = document.createElement('div');
        toast.className = 'buff-toast';
        toast.textContent = text;
        toast.style.color = color || '#854D25';
        toast.style.left  = '40%';
        toast.style.top   = '100px';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function waitForSoundManager(cb) {
        if (window.soundManager && window.soundManager.sounds.music.game) {
            cb(window.soundManager);
            return;
        }
        const timer = setInterval(() => {
            if (window.soundManager && window.soundManager.sounds.music.game) {
                clearInterval(timer);
                cb(window.soundManager);
            }
        }, 50);
    }

    document.addEventListener('DOMContentLoaded', () => {
        waitForSoundManager(sm => {
            sm.loadSettings();
            const lastType = sessionStorage.getItem('musicType') || 'game';
            if (!sm.currentMusic || sm.currentMusic.paused) {
                sm.playMusic(lastType);
            }
        });
    });

    const statHp = document.getElementById('statHp');
    const statAtk = document.getElementById('statAtk');
    const statDef = document.getElementById('statDef');
    const skillIcon = document.getElementById('skillIcon');
    const skillQuestionBtn = document.getElementById('skillQuestionBtn');
    const lvlupBtn = document.getElementById('lvlupBtn');

    const grid = document.getElementById('charactersGrid');
    const characterDetail = document.getElementById('characterDetail');
    const detailImage = document.getElementById('detailImage');
    const detailName = document.getElementById('detailName');
    const detailRarity = document.getElementById('detailRarity');
    const detailDescription = document.getElementById('detailDescription');

    const lorePanel = document.getElementById('lorePanel');
    const loreText = document.getElementById('loreText');
    const closeLoreBtn = document.getElementById('closeLoreBtn');

    const skillPanel = document.getElementById('skillPanel');
    const skillText = document.getElementById('skillText');
    const closeSkillBtn = document.getElementById('closeSkillBtn');


    const backToGridBtn = document.getElementById('backToGridBtn');
    const closeBtn = document.getElementById('closeBtn');
    const informBtn = document.getElementById('informBtn');

    let allCharacters = [];      //все персонажи из бд
    let ownedIds = [];           //Id персонажей пользователя
    let selectedCharacter = null;

    //загрузка всех персонажей из бд
    async function loadAllCharacters() {
        try {
            const characters = await api.getAllCharacters();
            console.log('Все персонажи из БД:', characters);
            return characters.map(char => ({
                id: char.id,
                name: char.name,
                lore: char.lore || 'Описание пока не добавлено',
                skill_inform: char.skill_inform,
                sprite_url: char.sprite_url || 'images/default_icon.png',
                splash_art_url: char.splash_art_url || 'images/default_splash.png',
                rarity: char.rarity,
                skill_icon: char.skill_icon || 'images/default_skill.png',
                base_hp: char.base_hp || 100,
                base_attack: char.base_attack || 50,
                base_defense: char.base_defense || 30,
                skill_description: char.skill_description || 'Наносит мощный урон по противнику'
            }));
        } catch (error) {
            console.error('Ошибка загрузки персонажей:', error);
            return [];
        }
    }

    //загрузка id персонажей пользователя
    async function loadUserCharacterIds() {
        try {
            const userChars = await api.getUserCharacters();
            ownedIds = userChars.map(uc => uc.character_id);
            console.log('Персонажи пользователя (ID):', ownedIds);
        } catch (error) {
            console.error('Ошибка загрузки персонажей пользователя:', error);
            ownedIds = [];
        }
    }

    //сетка персонажей
    function displayCharacters() {
        if (!grid) return;
        
        grid.innerHTML = '';
        
        allCharacters.forEach(character => {
            const isOwned = ownedIds.includes(character.id);
            const card = document.createElement('div');
            card.className = 'character-card';
            if (!isOwned) {
                card.classList.add('locked');
            }
            
            card.innerHTML = `
                <img src="${character.splash_art_url}" alt="${character.name}" class="character-img" />
                <span class="character-name">${character.name}</span>
            `;
            
            card.onclick = () => {
                
                if (isOwned) {
                    waitForSoundManager(sm => sm.playSfx('big'));
                    selectedCharacter = character;
                    openCharacterDetail(character);
                } else {
                    showBuffToast('У вас еще не получен этот персонаж!');
                }
            };
            
            grid.appendChild(card);
        });
    }

    //для полученных персонажей открытие карточки
    async function openCharacterDetail(character) {
        //управление панелями
        lorePanel.style.display = 'none';
        detailDescription.style.display = 'block';
        backToGridBtn.style.display = 'block';
        closeLoreBtn.style.display = 'none';
        skillPanel.style.display = 'none';
        closeSkillBtn.style.display = 'none';
    
        grid.style.display = 'none';
        detailImage.src = character.splash_art_url;
        detailName.textContent = character.name;
        detailRarity.textContent = character.rarity === 'common' ? 'Обычный' : 
            character.rarity === 'epic' ? 'Эпический' : 'Легендарный';
    
        try {
            const userChars = await api.getUserCharacters();
            const userChar = userChars.find(uc => uc.character_id === character.id);
        
            if (userChar) { //текущие характеристики
                statHp.textContent = userChar.current_hp || 0;
                statAtk.textContent = userChar.current_attack || 0;
                statDef.textContent = userChar.current_defense || 0;
            
                selectedCharacter = {
                    ...character,
                    id: character.id,
                    current_hp: userChar.current_hp,
                    current_attack: userChar.current_attack,
                    current_defense: userChar.current_defense,
                    level: userChar.level,
                    constellation: userChar.constellation,
                    skill_level: userChar.skill_level
                };
            } else { //базовые характеристики
                statHp.textContent = character.base_hp || 0;
                statAtk.textContent = character.base_attack || 0;
                statDef.textContent = character.base_defense || 0;
                selectedCharacter = character;
            }
        } catch (error) {
            console.error('Ошибка загрузки характеристик:', error);
            statHp.textContent = character.base_hp || 0;
            statAtk.textContent = character.base_attack || 0;
            statDef.textContent = character.base_defense || 0;
            selectedCharacter = character;
        }
        skillIcon.src = character.skill_icon || 'images/default_skill.png';
    
        characterDetail.style.display = 'block';
    }

    //действие кнопки возврата к сетке
    function backToGrid() {
        waitForSoundManager(sm => sm.playSfx('big'));
        grid.style.display = 'grid';
        characterDetail.style.display = 'none';
        lorePanel.style.display = 'none';
        closeLoreBtn.style.display = 'none';
        backToGridBtn.style.display = 'none';

        skillPanel.style.display = 'none';
        closeSkillBtn.style.display = 'none';
    }

    //кнопка закрытия (возврат на game.html)
    closeBtn.onclick = () => {
        waitForSoundManager(sm => sm.navigate('game.html', 'small'));
    };

    //кнопка информации (открытие лора)
    informBtn.onclick = () => {
         waitForSoundManager(sm => sm.playSfx('small'));
        loreText.textContent = selectedCharacter.lore;
        detailDescription.style.display = 'none';
        closeLoreBtn.style.display = 'block';
        lorePanel.style.display = 'block';

        skillPanel.style.display = 'none';
        closeSkillBtn.style.display = 'none';
    };

    //кнока закрытия лора
    closeLoreBtn.onclick = () => {
        waitForSoundManager(sm => sm.playSfx('big'));
        lorePanel.style.display = 'none';
        detailDescription.style.display = 'block';
        closeLoreBtn.style.display = 'none';

        skillPanel.style.display = 'none';
        closeSkillBtn.style.display = 'none';
    };

    //кнопка информации о способности
    skillQuestionBtn.onclick = () => {
         waitForSoundManager(sm => sm.playSfx('small'));
        skillText.textContent = selectedCharacter.skill_inform;
        detailDescription.style.display = 'none';
        closeSkillBtn.style.display = 'block';
        skillPanel.style.display = 'block';

        lorePanel.style.display = 'none';
        closeLoreBtn.style.display = 'none';
    };

    //кнопка закртия информации о способности
    closeSkillBtn.onclick = () => {
        waitForSoundManager(sm => sm.playSfx('big'));
        skillPanel.style.display = 'none';
        detailDescription.style.display = 'block';
        closeLoreBtn.style.display = 'none';

        lorePanel.style.display = 'none';
        closeSkillBtn.style.display = 'none';
    };

    //кнопка крестика
    backToGridBtn.onclick = backToGrid;

    //кнопка улучшения персонажа
    lvlupBtn.onclick = () => {
        if (selectedCharacter && selectedCharacter.id) {
            waitForSoundManager(sm => sm.navigate(`lvlup.html?id=${selectedCharacter.id}`, 'big'));
        } else {
            showBuffToast('Ошибка: персонаж не выбран');
        }
    };

    //инициализация
    async function init() {
        await loadUserCharacterIds();      
        allCharacters = await loadAllCharacters();  
        displayCharacters();
    }

    init();

    //блокировки для отсутствия лишней кликабельности
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('paste', (e) => e.preventDefault());
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && ['s', 'c', 'x', 'v'].includes(e.key)) {
            e.preventDefault();
        }
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
